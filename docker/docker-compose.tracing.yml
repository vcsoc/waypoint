name: waypoint-tracing

services:
  waypoint:
    build:
      context: ..
      target: runtime
      args:
        WAYPOINT_RELEASE_TAG: ${WAYPOINT_RELEASE_TAG:-}
    command: ["--config", "/app/tracing-config.yaml", "--port", "4000"]
    environment:
      WAYPOINT_MASTER_KEY: ${WAYPOINT_MASTER_KEY:?set WAYPOINT_MASTER_KEY}
      WAYPOINT_SALT_KEY: sk-local-tracing-salt-key
      DATABASE_URL: postgresql://waypoint:waypoint@db:5432/waypoint
      STORE_MODEL_IN_DB: "True"
      WAYPOINT_LENS_URL: http://lens-worker:4318
      WAYPOINT_LENS_PUBLIC_URL: http://localhost:4318
      WAYPOINT_LENS_SERVICE_TOKEN: ${WAYPOINT_LENS_SERVICE_TOKEN:?set WAYPOINT_LENS_SERVICE_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LENS_WORKER_IMAGE: ${LENS_WORKER_IMAGE:-}
    volumes:
      - ./tracing-config.yaml:/app/tracing-config.yaml:ro
    ports:
      - "127.0.0.1:4002:4000"
    depends_on:
      db:
        condition: service_healthy

  lens-worker:
    build:
      context: ..
      dockerfile: deploy/lens/Dockerfile
      args:
        WAYPOINT_RELEASE_TAG: ${WAYPOINT_RELEASE_TAG:?set WAYPOINT_RELEASE_TAG to the source commit}
    environment:
      WAYPOINT_URL: http://litellm:4000
      WAYPOINT_LENS_SERVICE_TOKEN: ${WAYPOINT_LENS_SERVICE_TOKEN:?set WAYPOINT_LENS_SERVICE_TOKEN}
      CLICKHOUSE_URL: http://default:local-tracing@clickhouse:8123
      CLICKHOUSE_DATABASE: waypoint
    ports:
      - "127.0.0.1:4318:4318"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${LENS_WORKER_TMP_SIZE:-1g},mode=1777
    mem_limit: 2g
    cpus: 2
    pids_limit: 64
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: waypoint
      POSTGRES_USER: waypoint
      POSTGRES_PASSWORD: waypoint
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waypoint -d waypoint"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:26.9.6.6
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: local-tracing
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ports:
      - "127.0.0.1:18123:8123"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "default", "--password", "local-tracing", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  clickhouse_data:
