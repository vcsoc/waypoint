# Waypoint quickstart stack: the gateway plus a Postgres database that stores
# models, virtual keys, and spend logs. Used by
# https://docs.litellm.ai/docs/proxy/docker_quick_start
#
#   curl -sSLO https://github.com/BerriAI/litellm/raw/main/docker/docker-compose.quickstart.yml
#   printf 'WAYPOINT_MASTER_KEY=sk-%s\nLITELLM_SALT_KEY=sk-%s\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" > .env
#   docker compose -f docker-compose.quickstart.yml up -d
#
# Compose reads .env from this directory. Keep it: regenerating WAYPOINT_SALT_KEY
# makes credentials already stored in the database unreadable. For anything
# beyond local evaluation, pin the image to a specific release tag.
services:
  waypoint:
    image: docker.litellm.ai/berriai/litellm:main-stable
    ports:
      # WAYPOINT_BIND is empty by default, so this stays "4000:4000". The quickstart
      # script sets it to "127.0.0.1:" so new installs listen on this machine only.
      - "${WAYPOINT_BIND:-}${WAYPOINT_PORT:-4000}:4000"
    environment:
      WAYPOINT_MASTER_KEY: ${WAYPOINT_MASTER_KEY:?set it in .env - see the header of this file}
      WAYPOINT_SALT_KEY: ${WAYPOINT_SALT_KEY:?set it in .env - see the header of this file}
      DATABASE_URL: postgresql://waypoint:${POSTGRES_PASSWORD:-waypoint}@db:5432/waypoint
      STORE_MODEL_IN_DB: "True"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: waypoint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waypoint}
      POSTGRES_DB: waypoint
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waypoint"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
