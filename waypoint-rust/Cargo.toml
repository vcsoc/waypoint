[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/vcsoc/waypoint"

[workspace.dependencies]
waypoint-config = { path = "crates/config" }
waypoint-router = { path = "crates/router" }
waypoint-tracing = { path = "crates/tracing" }
waypoint-traces = { path = "crates/traces" }
waypoint-traces-cache = { path = "crates/traces-cache" }
waypoint-traces-clickhouse = { path = "crates/traces-clickhouse" }
waypoint-storage-clickhouse = { path = "crates/storage-clickhouse" }
waypoint-inference = { path = "crates/inference" }
waypoint-inference-transcription = { path = "crates/inference-transcription" }
waypoint-inference-responses = { path = "crates/inference-responses" }
waypoint-inference-messages = { path = "crates/inference-messages" }
waypoint-inference-chat = { path = "crates/inference-chat" }
waypoint-inference-ocr = { path = "crates/inference-ocr" }
waypoint-inference-testing = { path = "crates/inference-testing" }
waypoint-gateway-mcp = { path = "crates/gateway-mcp" }
waypoint-gateway = { path = "crates/gateway" }
waypoint-gateway-inference = { path = "crates/gateway-inference" }
waypoint-gateway-auth = { path = "crates/gateway-auth" }
waypoint-gateway-management = { path = "crates/gateway-management" }
waypoint-gateway-ui = { path = "crates/gateway-ui" }
waypoint-coroutine = { path = "crates/coroutine" }
waypoint-host = { path = "crates/host" }
waypoint-host-http = { path = "crates/host-http" }
waypoint-host-native = { path = "crates/host-native" }
waypoint-callbacks-legacy-python = { path = "crates/callbacks-legacy-python" }
waypoint-framer = { path = "crates/framer" }
waypoint-auth = { path = "crates/auth" }
waypoint-auth-types = { path = "crates/auth-types" }
waypoint-auth-aws = { path = "crates/auth-aws" }
waypoint-auth-azure = { path = "crates/auth-azure" }
waypoint-auth-gcp = { path = "crates/auth-gcp" }
waypoint-secrets = { path = "crates/secrets" }
waypoint-secrets-types = { path = "crates/secrets-types" }
waypoint-secrets-aws = { path = "crates/secrets-aws" }
waypoint-secrets-google = { path = "crates/secrets-google" }
waypoint-secrets-hashicorp = { path = "crates/secrets-hashicorp" }
waypoint-secrets-azure = { path = "crates/secrets-azure" }
waypoint-secrets-cyberark = { path = "crates/secrets-cyberark" }
waypoint-http = { path = "crates/http" }
waypoint-llms = { path = "crates/llms" }
waypoint-llms-types = { path = "crates/llms-types" }
waypoint-core-utils = { path = "crates/core-utils" }
waypoint-db = { path = "crates/db" }
waypoint-db-testing = { path = "crates/db-testing" }
waypoint-cache = { path = "crates/cache" }
waypoint-cache-azure-blob = { path = "crates/cache-azure-blob" }
waypoint-cache-memory = { path = "crates/cache-memory" }
waypoint-cache-redis = { path = "crates/cache-redis" }
waypoint-cache-s3 = { path = "crates/cache-s3" }
waypoint-cache-gcs = { path = "crates/cache-gcs" }
waypoint-cache-disk = { path = "crates/cache-disk" }
waypoint-cache-redis-semantic = { path = "crates/cache-redis-semantic" }
waypoint-cache-response = { path = "crates/cache-response" }
waypoint-cache-qdrant-semantic = { path = "crates/cache-qdrant-semantic" }
waypoint-cache-testing = { path = "crates/cache-testing" }
waypoint-token-counter = { path = "crates/token-counter" }
waypoint-token-counter-fast = { path = "crates/token-counter-fast" }
waypoint-token-counter-huggingface = { path = "crates/token-counter-huggingface" }
waypoint-token-counter-tiktoken = { path = "crates/token-counter-tiktoken" }
waypoint-host-python = { path = "crates/host-python" }
waypoint-python-compat = { path = "crates/python-compat" }

askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
tracing = "0.1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "multipart"] }
axum-login = "0.18.0"
tower-sessions = { version = "0.14.0", features = ["memory-store"] }
bytes = "1"
http = "1"
google-cloud-auth = { version = "1.16.0", default-features = false }
jsonwebtoken = { version = "11.1.0", default-features = false }
hyper-util = { version = "0.1.20", default-features = false, features = ["client-proxy"] }
proptest = "1.7.0"
pyo3 = "0.29.2"
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"] }
rand = "0.8"
macro_rules_attribute = "0.2.3"
schemars = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "http2", "stream"] }
qdrant-client = { version = "1.19.0", default-features = false }
uuid = { version = "1", features = ["v4"] }
rstest = "0.26.1"
wiremock = "0.6.5"
rstest_reuse = "0.7.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustify = "=0.7.0"
rustify_derive = "=0.5.5"
vaultrs = { version = "=0.8.0", default-features = false, features = ["rustls"] }
rustls-native-certs = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
serde_with = { version = "=3.16.1", default-features = false, features = ["std", "macros"] }
sha2 = "0.10"
syn = { version = "2", default-features = false }
sqlx = { version = "0.9.0", default-features = false, features = ["json", "macros", "postgres", "runtime-tokio", "chrono", "tls-rustls-ring-native-roots"] }
proc-macro2 = "1"
quote = "1"
subtle = "2"
thiserror = "2.0"
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"] }
tiktoken-rs = "0.12.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
base64 = "0.22"
flate2 = "1"
semver = "1"
tar = "0.4"
target-lexicon = "0.13.5"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
moka = { version = "0.12.16", features = ["future"] }
strum = { version = "0.28.0", features = ["derive"] }
url = "2.5.8"
percent-encoding = "2.3"
webpki-roots = "1"
time = { version = "0.3.53", features = ["parsing"] }
criterion = "0.8.2"
fancy-regex = "0.19.2"
veil = "0.3.0"
prost = "0.14.4"
opentelemetry-proto = "0.33"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = false
incremental = false
strip = "symbols"
