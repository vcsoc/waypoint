{{- if .Values.db.deployStandalone -}}
{{- include "waypoint.validateBundledPostgresImageTag" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "waypoint.fullname" . }}-dbcredentials
data:
  # Password for the "postgres" user
  postgres-password: {{ ( index .Values.postgresql.auth "postgres-password") | default "waypoint" | b64enc }}
  username: {{ .Values.postgresql.auth.username | default "waypoint" | b64enc }}
  password: {{ .Values.postgresql.auth.password | default "waypoint" | b64enc }}
type: Opaque
{{- end -}}