name: waypoint-lens

services:
  waypoint:
    image: ghcr.io/berriai/litellm:${WAYPOINT_VERSION:?Set WAYPOINT_VERSION to a published release, without the v prefix}
    entrypoint:
      - python3
      - -c
      - |
        import os, sys
        from urllib.parse import quote
        postgres_password = quote(os.environ["POSTGRES_PASSWORD"], safe="")
        os.environ["DATABASE_URL"] = f"postgresql://waypoint:{postgres_password}@db:5432/waypoint"
        os.execv("docker/prod_entrypoint.sh", ["docker/prod_entrypoint.sh", *sys.argv[1:]])
    command: ["--config", "/app/lens-config.yaml", "--port", "4000"]
    environment:
      WAYPOINT_MASTER_KEY: ${WAYPOINT_MASTER_KEY:?Set a strong master key}
      WAYPOINT_SALT_KEY: ${WAYPOINT_SALT_KEY:?Set a permanent encryption key and keep it across upgrades}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a permanent database password}
      STORE_MODEL_IN_DB: "True"
      WAYPOINT_LENS_URL: http://lens-worker:4318
      WAYPOINT_LENS_PUBLIC_URL: ${WAYPOINT_LENS_PUBLIC_URL:-http://localhost:4318}
      WAYPOINT_LENS_SERVICE_TOKEN: ${WAYPOINT_LENS_SERVICE_TOKEN:?Set the shared Lens service secret}
      LENS_WORKER_IMAGE: ghcr.io/berriai/litellm-lens-worker:v${WAYPOINT_VERSION}
    volumes:
      - ./config.yaml:/app/lens-config.yaml:ro
    ports:
      - "127.0.0.1:${WAYPOINT_PORT:-4000}:4000"
    networks: [proxy, database]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  lens-worker:
    image: ghcr.io/berriai/litellm-lens-worker:v${WAYPOINT_VERSION}
    environment:
      WAYPOINT_URL: http://litellm:4000
      LENS_WORKER_TOKEN: ${LENS_WORKER_TOKEN:-}
      WAYPOINT_LENS_SERVICE_TOKEN: ${WAYPOINT_LENS_SERVICE_TOKEN}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set a permanent ClickHouse password}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-waypoint}
      AGENT_TRACING_RETENTION_DAYS: ${AGENT_TRACING_RETENTION_DAYS:-14}
    depends_on: [waypoint]
    networks: [proxy, storage]
    ports:
      - "127.0.0.1:${LENS_PORT:-4318}:4318"
    mem_limit: 2g
    cpus: 2
    pids_limit: 64
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=${LENS_WORKER_TMP_SIZE:-1g}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: waypoint
      POSTGRES_USER: waypoint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks: [database]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waypoint -d waypoint"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:26.9.6.6
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "default", "--password", "${CLICKHOUSE_PASSWORD}", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [storage]

networks:
  proxy:
  database:
    internal: true
  storage:
    internal: true

volumes:
  postgres_data:
  clickhouse_data:
