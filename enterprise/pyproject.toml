[project]
name = "waypoint-enterprise"
version = "0.1.75"
description = "Package for Waypoint Enterprise features"
readme = "README.md"
requires-python = ">=3.9"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE.md"]
authors = [
    { name = "BerriAI" },
]

[project.urls]
Homepage = "https://github.com/vcsoc/waypoint"
Repository = "https://github.com/vcsoc/waypoint"
Documentation = "https://github.com/vcsoc/waypoint#readme"

[build-system]
requires = ["uv_build==0.11.8"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.10.9"

[tool.uv.build-backend]
module-root = ""

[tool.commitizen]
version = "0.1.75"
version_files = [
    "pyproject.toml:^version",
    "../pyproject.toml:waypoint-enterprise==",
]
