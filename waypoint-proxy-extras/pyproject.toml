[project]
name = "waypoint-proxy-extras"
version = "0.4.107"
description = "Additional files for the Waypoint Proxy. Reduces the size of the main waypoint package."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psycopg>=3.2,<4.0",
    "psycopg-binary>=3.2,<4.0",
]
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "BerriAI" },
]

[project.urls]
Homepage = "https://github.com/vcsoc/waypoint"
Repository = "https://github.com/vcsoc/waypoint"
Documentation = "https://github.com/vcsoc/waypoint#readme"

[build-system]
requires = ["uv_build==0.11.8"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.10.9"

[tool.uv.build-backend]
module-root = ""

[tool.commitizen]
version = "0.4.107"
version_files = [
    "pyproject.toml:^version",
    "../pyproject.toml:waypoint-proxy-extras==",
]
